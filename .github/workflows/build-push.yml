name: Backend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif

  build-and-scan:
    name: Build and Scan Docker Image
    needs:
      - test
      - secret-scan
      - semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: |
          docker build \
            -t devops-employee-backend:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 #v0.36.0
        with:
          image-ref: devops-employee-backend:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      
      - name: Save Docker image
        run: |
          docker save \
            devops-employee-backend:${{ github.sha }} \
            -o devops-employee-backend.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: devops-employee-backend-${{ github.sha }}
          path: devops-employee-backend.tar
          retention-days: 1
  

  push-to-acr:
    name: Push Docker Image to ACR
    needs: build-and-scan
    environment: backend-acr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: devops-employee-backend-${{ github.sha }}

      - name: Load Docker image
        run: |
          docker load \
            --input devops-employee-backend.tar

      - name: Azure Login
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Tag Docker image
        run: |
          docker tag \
            devops-employee-backend:${{ github.sha }} \
            ${{ vars.ACR_LOGIN_SERVER }}/devops-employee-backend:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/devops-employee-backend:${{ github.sha }}
    
  update-k8s-dev:
    name: Update K8s dev backend image
    needs: push-to-acr
    environment: backend-k8s-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout K8s repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: harupandi/devops-employee-k8s
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: k8s

      - name: Update backend image
        working-directory: k8s
        run: |
          yq -i '.backend.image.tag = "${{ github.sha }}"' \
            charts/devops-employee/values-dev.yaml

      - name: Commit and push
        working-directory: k8s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/devops-employee/values-dev.yaml
          git commit -m "chore: update backend image to ${{ github.sha }}"
          git push